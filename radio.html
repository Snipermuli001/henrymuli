<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050816"><title>RADIO HUB | Project Henry</title>
<link rel="icon" href="sphoto.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--white:#f5f8ff;--muted:#9eacc7;--cyan:#52e8ff;--blue:#5b7cff;--violet:#a56cff;--line:rgba(147,171,220,.14)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--white);font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 10%,rgba(82,232,255,.08),transparent 30%),radial-gradient(circle at 90% 20%,rgba(165,108,255,.1),transparent 32%);z-index:-2}.grid{position:fixed;inset:0;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(82,232,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(82,232,255,.05) 1px,transparent 1px);background-size:70px 70px}
.container{width:min(1180px,calc(100% - 36px));margin:auto}.top{position:sticky;top:14px;z-index:10;padding-top:14px}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,8,22,.82);backdrop-filter:blur(18px)}.brand{font:700 19px "Space Grotesk";color:#fff;text-decoration:none}.brand b{color:var(--cyan)}.back{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted);padding:10px 13px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
main{padding:70px 0 70px}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--cyan);font-weight:800}.hero h1{font:700 clamp(52px,8vw,92px)/.88 "Space Grotesk";letter-spacing:-.065em;margin:16px 0}.hero h1 span{color:transparent;-webkit-text-stroke:1px rgba(245,248,255,.8)}.hero p{max-width:720px;color:var(--muted);font-size:14px;line-height:1.7}.source{display:inline-flex;margin-top:12px;padding:8px 11px;border:1px solid rgba(82,232,255,.2);border-radius:10px;color:#7f91b1;font-size:9px;letter-spacing:.12em;text-decoration:none}
.toolbar{margin:32px 0 20px;display:flex;gap:10px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:rgba(10,20,45,.7);color:var(--muted);padding:11px 15px;border-radius:12px;font:800 9px Inter;letter-spacing:.12em;cursor:pointer}.tab.active,.tab:hover{color:#fff;border-color:rgba(82,232,255,.45)}.search{flex:1;min-width:220px;border:1px solid var(--line);background:rgba(7,14,34,.75);color:#fff;padding:12px 15px;border-radius:12px;outline:0}.meta{color:#63728e;font-size:9px;letter-spacing:.12em;margin-bottom:18px}
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(12,25,55,.86),rgba(6,11,29,.94));padding:18px;min-height:245px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}.card:hover{border-color:rgba(82,232,255,.35);transform:translateY(-2px);transition:.2s}.station{display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;border-radius:14px;background:#fff;object-fit:contain;padding:6px}.name{min-width:0}.name h2{font:700 17px "Space Grotesk";margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name p{font-size:8px;color:var(--cyan);letter-spacing:.1em;margin:5px 0 0}.tag{color:#7d8ca8;font-size:9px;line-height:1.5;margin:16px 0;min-height:28px}.actions{margin-top:auto;display:flex;gap:8px}.listen,.open{padding:12px;border-radius:11px;font:800 9px Inter;letter-spacing:.1em;text-decoration:none;text-align:center}.listen{flex:1;color:#07101e;background:var(--cyan);box-shadow:0 0 22px rgba(82,232,255,.12)}.open{color:#8392ad;border:1px solid var(--line)}.listen:hover,.open:hover{filter:brightness(1.12)}@media(max-width:1000px){.stations{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.stations{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.container{width:calc(100% - 22px)}main{padding-top:50px}.stations{grid-template-columns:1fr}.hero h1{font-size:54px}}
</style><script src="/js/watchtower.js" defer></script></head>
<body><div class="grid"></div>
<header class="top"><div class="container nav"><a class="brand" href="/">HENRY<b>.M</b></a><a class="back" href="/">← HOME</a></div></header>
<main><div class="container">
<section class="hero"><span class="eyebrow">PROJECT HENRY / LIVE AUDIO</span><h1>RADIO<br><span>HUB.</span></h1><p>Kenyan live radio in one place. Choose a station and listen through its live Radio.co.ke station page — the same direct browser-stream approach used by the directory.</p><a class="source" href="https://radio.co.ke/stations/" target="_blank" rel="noopener">RADIO.CO.KE DIRECTORY ↗</a></section>
<div class="toolbar"><button class="tab active" data-filter="all">🇰🇪 ALL KENYA</button><button class="tab" data-filter="music">🎵 MUSIC</button><button class="tab" data-filter="news">📰 NEWS & TALK</button><input class="search" id="search" placeholder="Search Kenyan stations..." autocomplete="off"></div>
<div class="meta" id="meta"></div><section class="stations" id="stations"></section>
</div></main>
<script>
const stations=[
["Classic 105 FM","Nairobi · 105.2 FM","Classic hits · Talk","classic-105-fm"],
["Radio Citizen","Nairobi · 106.7 FM","Swahili · News · African Music","radio-citizen"],
["Radio Jambo","Nairobi","Sports · Talk · Music","radio-jambo"],
["Kiss FM","National","Music · Entertainment","kiss-fm"],
["Radio Maisha","Nairobi","Swahili · Music · Talk","radio-maisha"],
["Ghetto Radio","Nairobi","Urban · Music · Youth","ghetto-radio"],
["Spice FM","Nairobi","News · Talk · Music","spice-fm"],
["Nation FM","Nairobi","News · Talk · Music","nation-fm"],
["Radio 47","National","News · Talk · Music","radio-47"],
["Homeboyz Radio","Nairobi","Urban · Music · Entertainment","homeboyz-radio"],
["Hot 96 FM","Nairobi","Music · News · Talk","hot-96-fm"],
["Mayienga FM","Nairobi","Music · Community","mayienga-fm"],
["Capital FM","Nairobi","English · Music · News","capital-fm"],
["Hope FM Kenya","Nairobi","Gospel · Faith · Talk","hope-fm-kenya"],
["NRG Radio","Nairobi","Urban · Music · Youth","nrg-radio"],
["Minto FM","Nairobi","Kenyan · Music · Community","minto-fm"],
["KBC English Service","National","News · Talk · Public Radio","kbc-english-service"],
["Inooro FM","Nairobi","Kikuyu · News · Music","inooro-fm"],
["Radio Maria","Murang'a","Catholic · Gospel · Talk","radio-maria"],
["Taach FM","Eldoret","Community · Music","taach-fm"],
["Gukena FM","Nairobi","Kikuyu · Music · Talk","gukena-fm"],
["Coro FM","Nairobi","Kikuyu · News · Music","coro-fm"],
["Ramogi FM","Nairobi","Luo · Music · News","ramogi-fm"],
["Chamgei FM","Nairobi","Kalenjin · Music · News","chamgei-fm"],
["Egesa FM","Western","Kisii · Music · Community","egesa-fm"],
["Kitwek FM","Nairobi","Kalenjin · Music · Talk","kitwek-fm"]
];
const el=document.getElementById("stations"),search=document.getElementById("search"),meta=document.getElementById("meta");let filter="all";
function render(){const q=search.value.trim().toLowerCase();const list=stations.filter(s=>{const t=(s[0]+" "+s[1]+" "+s[2]).toLowerCase();if(q&&!t.includes(q))return false;if(filter==="music")return /music|urban|hits|entertainment/.test(t);if(filter==="news")return /news|talk|community|public/.test(t);return true});meta.textContent=list.length+" STATIONS · LIVE LISTENING VIA RADIO.CO.KE";el.innerHTML=list.map(s=>{const url="https://radio.co.ke/listen/"+s[3]+"/";return '<article class="card"><div class="station"><div class="logo">📻</div><div class="name"><h2>'+s[0]+'</h2><p>'+s[1]+'</p></div></div><div class="tag">'+s[2]+'</div><div class="actions"><a class="listen" href="'+url+'" target="_blank" rel="noopener">▶ LISTEN NOW</a><a class="open" href="'+url+'" target="_blank" rel="noopener">↗</a></div></article>'}).join("")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});search.oninput=render;render();
</script></body></html>
