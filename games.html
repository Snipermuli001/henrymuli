<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050816">
<meta name="description" content="Henry's Game Zone — Shooter, Racing and Puzzle."><title>Henry's Game Zone | Play</title>
<link rel="stylesheet" href="/css/games.css">
  <script src="/js/watchtower.js" defer></script>
</head>
<body>
<div class="mode-dialog" id="mode-dialog" role="dialog" aria-modal="true"><div class="mode-card"><div class="mode-icon">🎮</div><h2>CHOOSE MODE</h2><p>How are you playing?</p><div class="mode-options"><button id="pc-mode" class="mode-choice"><b>PC</b><small>FULL SCREEN • KEYBOARD</small></button><button id="mobile-mode" class="mode-choice"><b>MOBILE</b><small>FULL SCREEN • TOUCH</small></button></div></div></div>
<div class="game-bg"></div>
<header class="game-header"><a class="back-link" href="/">← HENRY.M</a><div class="game-brand"><span>🎮</span><div><b>GAME ZONE</b></div></div><div class="game-audio"><button id="sound-toggle" type="button">🔊 SOUND ON</button><input id="sound-volume" type="range" min="0" max="1" step="0.05" value="0.65" aria-label="Game volume"></div><span class="live-dot">● ONLINE</span></header>
<main class="game-shell">
<section class="game-hero"><h1>LET'S <em>PLAY.</em></h1>
<div class="game-tabs" role="tablist"><button class="game-tab active" data-game="shooter">🔫 <span>Shooter</span></button><button class="game-tab" data-game="racing">🏎️ <span>Racing</span></button><button class="game-tab" data-game="puzzle">🧩 <span>Puzzle</span></button></div></section>
<section class="game-panel active" id="shooter-panel"><div class="game-info"><div><p class="kicker">01 / SHOOTER</p><h2>NEON TARGET</h2></div><div class="score-box"><span>SCORE</span><b id="shooter-score">0</b><small><span id="shooter-time">30</span>s</small></div></div><div class="canvas-wrap"><canvas id="shooter-canvas" width="360" height="520"></canvas><div class="game-message" id="shooter-message">READY?</div></div><div class="game-controls big-controls center-only"><button class="control-btn action-btn play-toggle" id="shooter-start">▶ PLAY</button><button class="control-btn action-btn restart-btn" id="shooter-restart">↻ RESTART</button></div></section>
<section class="game-panel" id="racing-panel"><div class="game-info"><div><p class="kicker">02 / RACING</p><h2>NEON HIGHWAY</h2></div><div class="race-scoreboard"><div class="race-score current"><span>CURRENT SCORE</span><b id="racing-score">0</b></div><div class="race-score best"><span>HIGH SCORE</span><b id="racing-high">0</b></div><div class="race-time"><span>TIME</span><b id="racing-time">30</b></div></div></div><div class="canvas-wrap"><canvas id="racing-canvas" width="360" height="520"></canvas><div class="game-message" id="racing-message">READY?</div></div><div class="race-controls big-controls"><button class="control-btn side-btn steer-btn" id="race-left">◀</button><div class="center-controls"><button class="control-btn action-btn play-toggle" id="racing-start">▶ PLAY</button><button class="control-btn action-btn restart-btn" id="racing-restart">↻ RESTART</button></div><button class="control-btn side-btn steer-btn" id="race-right">▶</button></div></section>
<section class="game-panel" id="puzzle-panel"><div class="game-info"><div><p class="kicker">03 / PUZZLE</p><h2>SLIDE 15</h2></div><div class="score-box"><span>MOVES</span><b id="puzzle-moves">0</b><small>TIME <span id="puzzle-time">0</span>s</small></div></div><div class="puzzle-board" id="puzzle-board"></div><div class="game-controls big-controls center-only"><button class="control-btn action-btn play-toggle" id="puzzle-new">▶ PLAY</button><button class="control-btn action-btn restart-btn" id="puzzle-restart">↻ RESTART</button></div></section>

</main><script src="/js/games.js?v=20261007fullscreen" defer></script>
</body></html>
