<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050816">
<meta name="robots" content="noindex">
<title>404 | Henry Muli Muthini</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.error-page{min-height:100svh;display:grid;place-items:center;padding:30px;text-align:center}
.error-card{max-width:650px;padding:55px 35px;border:1px solid rgba(82,232,255,.18);border-radius:25px;background:rgba(7,16,39,.55);box-shadow:0 30px 90px rgba(0,0,0,.35)}
.error-code{font:800 clamp(90px,20vw,180px)/.8 "Space Grotesk";color:transparent;-webkit-text-stroke:1px rgba(82,232,255,.75);margin:0 0 25px}
.error-card h1{font:700 30px "Space Grotesk";margin:0 0 12px}
.error-card p{color:#9eacc7;margin:0 auto 28px;max-width:480px}
</style>
</head>
<body>
<main class="error-page"><section class="error-card">
<div class="error-code">404</div><h1>PAGE NOT FOUND.</h1>
<p>The page you're looking for doesn't exist or may have moved.</p>
<a class="btn btn-primary" href="/">RETURN HOME <span>↗</span></a>
</section></main>
</body>
</html>
