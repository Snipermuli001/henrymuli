<html lang="en">
<head>

<style>
:root{color-scheme:dark;--cyan:#7cecff;--muted:#9aabc5;--panel:rgba(8,15,31,.78);--line:rgba(140,190,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030611;color:#edf5ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;color:inherit;cursor:pointer}#space{position:fixed;inset:0;touch-action:none;outline:none}canvas{display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(1,3,12,.2) 75%,rgba(1,3,12,.8) 130%);z-index:1}
.topbar{position:fixed;z-index:3;top:0;left:0;right:0;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:38px;height:38px;border:1px solid #70dff8;border-radius:50%;display:grid;place-items:center;color:var(--cyan);box-shadow:0 0 22px #2cb7df33;font-size:20px}.brand h1{font-size:14px;letter-spacing:.27em;margin:0;font-weight:700}.brand p{font-size:10px;letter-spacing:.17em;color:var(--muted);margin:4px 0 0}.top-actions{display:flex;gap:8px;pointer-events:auto}.glassbtn{border:1px solid var(--line);background:rgba(10,20,40,.55);backdrop-filter:blur(14px);padding:10px 13px;border-radius:11px;font-size:11px;letter-spacing:.06em}.glassbtn:hover,.glassbtn.active{border-color:#76e5ff99;background:#15304b99}
.hint{position:fixed;z-index:2;left:50%;top:94px;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;color:#c4d4e8aa;text-align:center;white-space:nowrap;pointer-events:none}

.info{position:fixed;z-index:3;right:24px;top:50%;transform:translateY(-50%);width:min(310px,calc(100vw - 32px));border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(22px);padding:22px;box-shadow:0 24px 90px #0005;transition:opacity .25s,transform .25s}.info.hidden{opacity:0;pointer-events:none;transform:translate(15px,-50%)}.eyebrow{font-size:9px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}.info h2{font-size:29px;letter-spacing:-.04em;margin:8px 0 5px}.sub{font-size:11px;color:var(--muted);line-height:1.5}.rule{height:1px;background:var(--line);margin:17px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:15px 12px}.fact small{display:block;font-size:9px;letter-spacing:.12em;color:#8195b4;text-transform:uppercase;margin-bottom:5px}.fact strong{font-size:13px;font-weight:550}.description{font-size:12px;line-height:1.7;color:#c4d1e3;margin:17px 0 0}.closeinfo{position:absolute;top:13px;right:13px;border:0;background:transparent;color:#8296b1;font-size:18px}
.bottom{position:fixed;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(5,12,27,.72);backdrop-filter:blur(18px);max-width:calc(100vw - 20px)}.control{border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 13px;font-size:11px;color:#c7d7eb;white-space:nowrap}.control:hover,.control.on{background:#18314b;border-color:#6edfff44;color:#fff}.speed{display:flex;align-items:center;gap:8px;padding:0 9px;color:#a9bdd5;font-size:10px}.speed input{width:86px;accent-color:var(--cyan)}.status{position:fixed;z-index:2;bottom:26px;left:24px;color:#6f849f;font-size:9px;letter-spacing:.13em;pointer-events:none}.toast{position:fixed;z-index:5;top:70px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#0a1930;color:#cdeeff;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:760px){.topbar{padding:14px}.brandmark{width:32px;height:32px}.brand h1{font-size:12px}.brand p{font-size:8px}.top-actions .glassbtn{padding:8px;font-size:10px}.hint{top:67px;font-size:9px}.planetbar{left:9px;top:auto;bottom:83px;transform:none;max-height:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;width:calc(100vw - 18px);padding:6px;gap:4px;border-radius:13px}.planetpick{min-width:auto;padding:9px 10px;font-size:10px}.planetpick .pname{display:none}.dot{width:10px;height:10px}.info{right:10px;top:83px;transform:none;width:min(265px,calc(100vw - 20px));padding:16px;border-radius:16px}.info.hidden{transform:translateY(-8px)}.info h2{font-size:24px}.rule{margin:11px 0}.facts{gap:10px}.description{margin-top:12px;font-size:11px}.bottom{bottom:10px;gap:2px;padding:5px;border-radius:13px}.control{padding:9px;font-size:10px}.speed{gap:5px;padding:0 4px}.speed input{width:58px}.status{display:none}}
@media(max-width:390px){.top-actions .glassbtn:first-child{display:none}.info{max-height:48vh;overflow:auto}.bottom .optional{display:none}}
</style>
</head>
<body>
<div id="space" aria-label="Interactive 3D solar system"></div><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="brandmark">✳</div><div><h1>ORRERY</h1><p>SOLAR SYSTEM PLAYGROUND · PROTOTYPE 01</p></div></div><div class="top-actions"><button class="glassbtn" id="labelsBtn">LABELS ON</button><button class="glassbtn" id="orbitsBtn">ORBITS ON</button></div></header>
<div class="hint">DRAG TO ORBIT &nbsp;·&nbsp; PINCH / SCROLL TO ZOOM &nbsp;·&nbsp; TAP A WORLD TO DISCOVER</div>

<div class="bottom"><button class="control" id="playBtn">Ⅱ Pause</button><button class="control" id="resetBtn">◎ Reset view</button><button class="control optional" id="tourBtn">✧ Surprise me</button><div class="speed"><span>TIME</span><input id="speed" aria-label="Simulation speed" type="range" min="0" max="3" step=".25" value="1"><span id="speedValue">1×</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=> {
const host=document.getElementById('space');
if(!window.THREE){host.innerHTML='<div style="padding:30px;color:white">Three.js could not load. Check your internet connection and refresh this prototype.</div>';return;}
const data=[
{name:'The Sun',kind:'G2V STAR',subtitle:'The star at the heart of our solar system',color:'#ffb347',size:2.15,dist:0,speed:0,diameter:'1.39 million km',day:'~25 Earth days',year:'~4.6 billion years old',temp:'5,500°C surface',moons:'8 planets orbit it',desc:'A vast sphere of hot plasma. Its gravity holds the solar system together, and nuclear fusion in its core releases the light and heat that make life on Earth possible.',type:'star'},
{name:'Mercury',kind:'TERRESTRIAL PLANET',subtitle:'A small, crater-covered world',color:'#aaa7a1',size:.27,dist:3.5,speed:1.6,diameter:'4,879 km',day:'58.6 Earth days',year:'88 Earth days',temp:'−180 to 430°C',moons:'0 known moons',desc:'The smallest planet and closest to the Sun. Mercury has an ancient, heavily cratered surface and almost no atmosphere to retain heat.',type:'rock',seed:1},
{name:'Venus',kind:'TERRESTRIAL PLANET',subtitle:'A world wrapped in thick clouds',color:'#e8bd83',size:.48,dist:4.7,speed:1.17,diameter:'12,104 km',day:'243 Earth days',year:'225 Earth days',temp:'~465°C average',moons:'0 known moons',desc:'Venus has a dense carbon-dioxide atmosphere and crushing surface pressure. Its runaway greenhouse effect makes it the hottest planet.',type:'cloud',seed:2},
{name:'Earth',kind:'TERRESTRIAL PLANET',subtitle:'Our pale blue home',color:'#4aabff',size:.52,dist:6.1,speed:1,diameter:'12,742 km',day:'23 h 56 min',year:'365.25 days',temp:'~15°C average',moons:'1 natural moon',desc:'A water-rich world with a protective atmosphere and a magnetic field. As far as we know, Earth is the only place in the universe where life has been confirmed.',type:'earth',seed:3},
{name:'Mars',kind:'TERRESTRIAL PLANET',subtitle:'The red planet',color:'#d76f4d',size:.37,dist:7.6,speed:.81,diameter:'6,779 km',day:'24 h 37 min',year:'687 Earth days',temp:'~−65°C average',moons:'2 small moons',desc:'A cold desert world with giant volcanoes, ancient river valleys and polar ice caps. Robotic explorers search its rocks for clues about its watery past.',type:'rock',seed:4},
{name:'Jupiter',kind:'GAS GIANT',subtitle:'King of the planets',color:'#d8ad8b',size:1.15,dist:10.1,speed:.44,diameter:'139,820 km',day:'9 h 56 min',year:'11.86 Earth years',temp:'~−110°C cloud tops',moons:'95 officially recognized',desc:'Jupiter is a giant world of hydrogen and helium, striped by powerful jet streams. Its Great Red Spot is a huge storm that has raged for centuries.',type:'jupiter',seed:5},
{name:'Saturn',kind:'GAS GIANT',subtitle:'The ringed jewel',color:'#e4d1a1',size:.95,dist:13.0,speed:.33,diameter:'116,460 km',day:'~10.7 hours',year:'29.4 Earth years',temp:'~−140°C cloud tops',moons:'146 confirmed moons',desc:'Saturn’s spectacular rings are made mostly of countless pieces of water ice with rocky material mixed in. The planet itself is less dense than liquid water.',type:'saturn',seed:6},
{name:'Uranus',kind:'ICE GIANT',subtitle:'An icy world tipped on its side',color:'#8ddbdc',size:.69,dist:15.7,speed:.23,diameter:'50,724 km',day:'~17.2 hours',year:'84 Earth years',temp:'~−195°C',moons:'28 known moons',desc:'Uranus contains water, ammonia and methane-rich materials beneath its atmosphere. Its extreme axial tilt gives it unusual, season-long sunlight patterns.',type:'ice',seed:7},
{name:'Neptune',kind:'ICE GIANT',subtitle:'A deep-blue world of fast winds',color:'#4978ff',size:.67,dist:18.2,speed:.18,diameter:'49,244 km',day:'~16.1 hours',year:'165 Earth years',temp:'~−200°C',moons:'16 known moons',desc:'Neptune is a distant ice giant with supersonic winds and a dynamic atmosphere. It takes about 165 Earth years to complete one trip around the Sun.',type:'ice',seed:8}
];
let scene,camera,renderer,controls,raycaster,mouse,clock,starGroup,selected=0,paused=false,showOrbits=true,showLabels=true,speed=1,planetObjects=[],orbitLines=[],labelSprites=[],sun,frameCount=0,lastFps=performance.now();
const TAU=Math.PI*2;
function seeded(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function makeTexture(d){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');let base=new THREE.Color(d.color);x.fillStyle='#'+base.getHexString();x.fillRect(0,0,512,256);
if(d.type==='earth'){x.fillStyle='#247c45';for(let i=0;i<95;i++){let px=seeded(i+d.seed)*512,py=seeded(i+23+d.seed)*256,w=12+seeded(i+8)*65,h=5+seeded(i+18)*24;x.beginPath();x.ellipse(px,py,w,h,seeded(i+2)*3,0,TAU);x.fill()}x.fillStyle='#d5e8e8';for(let i=0;i<70;i++){x.globalAlpha=.18+seeded(i)*.5;x.beginPath();x.ellipse(seeded(i+3)*512,seeded(i+13)*256,10+seeded(i+20)*60,2+seeded(i+10)*8,0,0,TAU);x.fill()}x.globalAlpha=1}
else if(d.type==='jupiter'||d.type==='saturn'){for(let i=0;i<42;i++){let yy=i*6.2;x.fillStyle=i%3===0?'rgba(105,60,42,.40)':i%2?'rgba(255,232,192,.38)':'rgba(125,76,51,.28)';x.fillRect(0,yy,512,2+seeded(i+4)*5)}if(d.type==='jupiter'){x.fillStyle='#b95839';x.beginPath();x.ellipse(350,155,38,19,-.1,0,TAU);x.fill();x.strokeStyle='#f1c3a1';x.lineWidth=4;x.stroke()}}
else {for(let i=0;i<1600;i++){let a=seeded(i+d.seed)*.22;x.fillStyle='rgba(255,255,255,'+a+')';x.fillRect(seeded(i+77)*512,seeded(i+19)*256,1+seeded(i+4)*7,1+seeded(i+5)*2)}if(d.type==='rock'){for(let i=0;i<100;i++){x.strokeStyle='rgba(30,20,20,'+(.08+seeded(i)*.2)+')';x.beginPath();x.arc(seeded(i+2)*512,seeded(i+5)*256,2+seeded(i+7)*14,0,TAU);x.stroke()}}}
return new THREE.CanvasTexture(c)}
function makeCloudTexture(){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');for(let i=0;i<2600;i++){const px=seeded(i+733)*1024,py=seeded(i+1933)*512,w=5+seeded(i+883)*48,h=2+seeded(i+383)*10;x.fillStyle='rgba(245,251,255,'+(.025+seeded(i+283)*.18)+')';x.beginPath();x.ellipse(px,py,w,h,seeded(i+93)*.2,0,TAU);x.fill()}return new THREE.CanvasTexture(c)}
function makeSunTexture(){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#b92e08');g.addColorStop(.22,'#ff6a12');g.addColorStop(.5,'#ffb12b');g.addColorStop(.78,'#ff6810');g.addColorStop(1,'#b92e08');x.fillStyle=g;x.fillRect(0,0,1024,512);for(let i=0;i<3400;i++){const px=seeded(i+11)*1024,py=seeded(i+17)*512,rx=3+seeded(i+23)*36,ry=1+seeded(i+29)*9;x.fillStyle='rgba(255,245,173,'+(.025+seeded(i+31)*.16)+')';x.beginPath();x.ellipse(px,py,rx,ry,seeded(i+37)*.2,0,TAU);x.fill()}for(let i=0;i<260;i++){x.strokeStyle='rgba(133,26,0,'+(.04+seeded(i+45)*.12)+')';x.lineWidth=1+seeded(i+51)*3;x.beginPath();let px=seeded(i+57)*1024,py=seeded(i+63)*512;x.moveTo(px,py);x.bezierCurveTo(px+20,py-20,px-15,py+25,px+35,py+12);x.stroke()}return new THREE.CanvasTexture(c)}
function spriteTexture(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,2,64,64,64);g.addColorStop(0,'rgba(255,246,209,1)');g.addColorStop(.12,'rgba(255,181,64,.8)');g.addColorStop(.36,'rgba(255,104,24,.22)');g.addColorStop(1,'rgba(255,70,10,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function makeLabel(text){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='500 24px Arial';x.fillStyle='#d7eaff';x.textAlign='center';x.fillText(text,128,38);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(2.5,.62,1);return s}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x030611);scene.fog=new THREE.FogExp2(0x030611,.0045);camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);camera.position.set(0,19,29);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=.42;controls.maxDistance=75;controls.target.set(0,0,0);controls.maxPolarAngle=Math.PI*.92;
scene.add(new THREE.AmbientLight(0x536080,.45));const light=new THREE.PointLight(0xffd4a0,2.7,100,1.3);scene.add(light);
starGroup=new THREE.Group();const positions=[],colors=[];for(let i=0;i<2300;i++){let u=seeded(i+91),v=seeded(i+191),theta=TAU*u,phi=Math.acos(2*v-1),r=75+seeded(i+291)*100;positions.push(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));let b=.45+seeded(i+391)*.55;colors.push(b,b*.92,1)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));const stars=new THREE.Points(geo,new THREE.PointsMaterial({size:.24,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:true}));starGroup.add(stars);scene.add(starGroup);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:spriteTexture(),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));glow.scale.set(8,8,1);scene.add(glow);
sun=new THREE.Mesh(new THREE.SphereGeometry(data[0].size,48,32),new THREE.MeshBasicMaterial({color:0xffbd55}));scene.add(sun);sun.userData.index=0;sun.add(glow);const sunLight=new THREE.PointLight(0xffb85c,2.5,120);scene.add(sunLight);
data.slice(1).forEach((d,i)=>{const geo=new THREE.SphereGeometry(d.size,36,28),mat=new THREE.MeshStandardMaterial({map:makeTexture(d),roughness:.92,metalness:0});const mesh=new THREE.Mesh(geo,mat);mesh.userData.index=i+1;scene.add(mesh);const entry={mesh,data:d,phase:seeded(i+12)*TAU};planetObjects.push(entry);if(['Earth','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'].includes(d.name)){const ac={Earth:0x4faeff,Venus:0xe8c58c,Mars:0xe87955,Jupiter:0xd8b18d,Saturn:0xd9c59b,Uranus:0x83e4e7,Neptune:0x527dff};const at=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.055,40,28),new THREE.MeshBasicMaterial({color:ac[d.name],transparent:true,opacity:.09,side:THREE.BackSide,depthWrite:false}));mesh.add(at);entry.atmosphere=at;}
if(d.name==='Earth'){const clouds=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.018,64,48),new THREE.MeshStandardMaterial({map:makeCloudTexture(),transparent:true,opacity:.72,depthWrite:false,roughness:1}));mesh.add(clouds);entry.clouds=clouds;const rainGeo=new THREE.BufferGeometry(),rp=[];for(let r=0;r<520;r++){const lat=(seeded(r+1001)-.5)*.9,lon=(seeded(r+2001)-.5)*1.1,rr=d.size*1.075;const xx=Math.cos(lat)*Math.cos(lon)*rr,yy=Math.sin(lat)*rr,zz=Math.cos(lat)*Math.sin(lon)*rr;rp.push(xx,yy,zz,xx-.006,yy-.025,zz-.004)}rainGeo.setAttribute('position',new THREE.Float32BufferAttribute(rp,3));const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0xa8dfff,transparent:true,opacity:.38,depthWrite:false}));rain.visible=false;mesh.add(rain);entry.rain=rain;}
if(d.name==='Mars'){const dust=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.075,48,32),new THREE.MeshBasicMaterial({color:0xd98258,transparent:true,opacity:.12,side:THREE.BackSide,depthWrite:false}));mesh.add(dust);entry.dust=dust;}
if(d.name==='Saturn'){const ring=new THREE.Mesh(new THREE.RingGeometry(d.size*1.28,d.size*2.05,80),new THREE.MeshStandardMaterial({color:0xc9b58e,side:THREE.DoubleSide,transparent:true,opacity:.8,roughness:1}));ring.rotation.x=Math.PI/2.25;mesh.add(ring)}
const orbitGeo=new THREE.BufferGeometry(),pts=[];for(let j=0;j<=160;j++){const a=j/160*TAU;pts.push(Math.cos(a)*d.dist,0,Math.sin(a)*d.dist)}orbitGeo.setFromPoints(pts);const line=new THREE.LineLoop(orbitGeo,new THREE.LineBasicMaterial({color:0x5079a8,transparent:true,opacity:.24}));scene.add(line);orbitLines.push(line);
const label=makeLabel(d.name);scene.add(label);labelSprites.push({sprite:label,object:mesh,d});});
const debrisGeo=new THREE.BufferGeometry(),debrisPos=[],debrisColors=[];for(let a=0;a<3200;a++){const ang=seeded(a+801)*TAU,rad=8.55+seeded(a+901)*1.05,y=(seeded(a+1001)-.5)*.34;debrisPos.push(Math.cos(ang)*rad,y,Math.sin(ang)*rad);const tint=.28+seeded(a+1101)*.48;debrisColors.push(tint,tint*.88,tint*.72)}debrisGeo.setAttribute('position',new THREE.Float32BufferAttribute(debrisPos,3));debrisGeo.setAttribute('color',new THREE.Float32BufferAttribute(debrisColors,3));scene.add(new THREE.Points(debrisGeo,new THREE.PointsMaterial({size:.025,vertexColors:true,transparent:true,opacity:.78,sizeAttenuation:true})));
const earthMoon=new THREE.Mesh(new THREE.SphereGeometry(.12,24,18),new THREE.MeshStandardMaterial({color:0x9da7b6,roughness:1}));scene.add(earthMoon);
const sunLabel=makeLabel('THE SUN');scene.add(sunLabel);labelSprites.push({sprite:sunLabel,object:sun,d:data[0]});
raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();clock=new THREE.Clock();buildBar();selectBody(0,false);renderer.domElement.addEventListener('pointerup',onTap);addEventListener('resize',resize);animate()}
function buildBar(){const bar=document.getElementById('planetbar');data.forEach((d,i)=>{const b=document.createElement('button');b.className='planetpick';b.innerHTML='<span class="dot" style="color:'+d.color+';background:'+d.color+'"></span><span class="pname">'+d.name+'</span>';b.title=d.name;b.addEventListener('click',()=>selectBody(i,true));bar.appendChild(b)})}
function selectBody(i,fly){selected=i;const d=data[i];planetObjects.forEach(p=>{if(p.rain)p.rain.visible=i===3&&camera.position.distanceTo(p.mesh.position)<3.2;});document.querySelectorAll('.planetpick').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('kind').textContent=d.kind;document.getElementById('bodyName').textContent=d.name;document.getElementById('subtitle').textContent=d.subtitle;document.getElementById('description').textContent=d.desc;document.getElementById('facts').innerHTML=[['Diameter',d.diameter],['Rotation',d.day],['Year / age',d.year],['Temperature',d.temp],['Moons',d.moons]].map(f=>'<div class="fact"><small>'+f[0]+'</small><strong>'+f[1]+'</strong></div>').join('');document.getElementById('info').classList.remove('hidden');if(fly){const obj=i===0?sun:planetObjects.find(p=>p.data===d).mesh;const pos=obj.getWorldPosition(new THREE.Vector3());const offset=new THREE.Vector3(0,Math.max(1.8,d.size*3),Math.max(4,d.size*5));controls.target.copy(pos);camera.position.copy(pos).add(offset);controls.update();toast('Travelling to '+d.name)}}
function onTap(e){if(e.button!==0)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects([sun,...planetObjects.map(p=>p.mesh)],false);if(hits.length)selectBody(hits[0].object.userData.index,true)}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1500)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!paused){planetObjects.forEach(p=>{p.phase+=dt*.15*p.data.speed*speed;const d=p.data;p.mesh.position.set(Math.cos(p.phase)*d.dist,Math.sin(p.phase*1.4)*.045,Math.sin(p.phase)*d.dist);p.mesh.rotation.y+=dt*.22*speed;if(p.clouds)p.clouds.rotation.y+=dt*.055*speed;if(p.dust)p.dust.rotation.y-=dt*.035*speed;if(p.rain)p.rain.visible=selected===3&&camera.position.distanceTo(p.mesh.position)<3.2});sun.rotation.y+=dt*.035*speed;starGroup.rotation.y+=dt*.0015;const earth=planetObjects.find(p=>p.data.name==='Earth');if(earth)earthMoon.position.set(earth.mesh.position.x+Math.cos(clock.elapsedTime*.45)*.88,earth.mesh.position.y+.06,earth.mesh.position.z+Math.sin(clock.elapsedTime*.45)*.88)}
labelSprites.forEach(({sprite,object,d})=>{sprite.position.copy(object.position);sprite.position.y+=d.size+ .45;sprite.visible=showLabels&&(camera.position.distanceTo(object.position)<48)});controls.update();renderer.render(scene,camera);frameCount++;if(performance.now()-lastFps>1800){document.getElementById('fpsLabel').textContent=Math.round(frameCount*1000/(performance.now()-lastFps))+' FPS';frameCount=0;lastFps=performance.now()}}
document.getElementById('playBtn').onclick=()=>{paused=!paused;document.getElementById('playBtn').textContent=paused?'▶ Play':'Ⅱ Pause';toast(paused?'Simulation paused':'Orbits moving')};
document.getElementById('resetBtn').onclick=()=>{camera.position.set(0,19,29);controls.target.set(0,0,0);controls.update();toast('Overview restored')};
document.getElementById('orbitsBtn').onclick=e=>{showOrbits=!showOrbits;orbitLines.forEach(o=>o.visible=showOrbits);e.currentTarget.textContent=showOrbits?'ORBITS ON':'ORBITS OFF';e.currentTarget.classList.toggle('active',showOrbits)};
document.getElementById('labelsBtn').onclick=e=>{showLabels=!showLabels;e.currentTarget.textContent=showLabels?'LABELS ON':'LABELS OFF';e.currentTarget.classList.toggle('active',showLabels)};
document.getElementById('closeInfo').onclick=()=>document.getElementById('info').classList.add('hidden');
document.getElementById('speed').oninput=e=>{speed=Number(e.target.value);document.getElementById('speedValue').textContent=speed+'×'};
document.getElementById('tourBtn').onclick=()=>selectBody(1+Math.floor(Math.random()*8),true);
init();
})();
</script>
</body></html>
