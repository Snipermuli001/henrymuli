name: Sync CineJoy catalogue

on:
  push:
    paths:
      - "scripts/sync-cinejoy.py"
      - ".github/workflows/cinejoy-sync.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Sync CineJoy metadata
        run: python scripts/sync-cinejoy.py

      - name: Commit catalogue changes
        run: |
          git config user.name "Henry Media Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cinejoy.json
          if git diff --cached --quiet; then
            echo "No CineJoy changes."
          else
            git commit -m "chore: sync CineJoy catalogue"
            git push
          fi
