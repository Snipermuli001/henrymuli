<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030713">
<meta name="description" content="Project Henry infinite navigation wheel — experimental prototype.">
<title>Project Henry — Infinite Wheel Prototype</title>
<style>
:root{color-scheme:dark;--cyan:#19cfff;--blue:#147bff;--violet:#8c4dff;--ink:#030713;--glow:rgba(16,155,255,.25)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:#eef8ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% 52%,#071b3a 0,#030916 42%,#01030a 78%)}button{font:inherit}
.scene{height:100svh;min-height:420px;position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column}
.aurora{position:absolute;inset:10% -15% 12%;z-index:-2;opacity:.65;filter:blur(36px);background:radial-gradient(ellipse at 18% 48%,rgba(0,160,255,.23),transparent 34%),radial-gradient(ellipse at 78% 54%,rgba(117,45,255,.2),transparent 34%);transition:filter .5s,opacity .5s}
.scene[data-mood="violet"] .aurora{background:radial-gradient(ellipse at 18% 48%,rgba(0,160,255,.15),transparent 34%),radial-gradient(ellipse at 78% 54%,rgba(142,49,255,.32),transparent 34%)}
.scene[data-mood="radio"] .aurora{background:radial-gradient(ellipse at 25% 45%,rgba(0,222,255,.28),transparent 38%),radial-gradient(ellipse at 75% 50%,rgba(35,94,255,.25),transparent 34%)}
header{display:flex;align-items:center;gap:14px;padding:clamp(18px,3.2vw,36px) clamp(18px,4vw,58px);z-index:3}
.brandmark{width:42px;height:48px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(0,181,255,.32))}
.brand-title{font-size:clamp(13px,1.35vw,18px);letter-spacing:.36em;font-weight:600}.tagline{margin-top:6px;color:#71d9ff;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.header-right{margin-left:auto;display:flex;align-items:center;gap:18px;color:#5ed9ff;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.infinity{font-size:27px;line-height:1}.menu{border:0;background:transparent;color:#66dfff;font-size:24px;cursor:pointer;padding:4px 0 4px 8px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;position:relative}
.heading{text-align:center;position:absolute;top:5%;left:0;right:0;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.38em;color:#4ccfff;text-transform:uppercase}.heading h1{font-size:clamp(22px,3vw,42px);font-weight:500;letter-spacing:.09em;margin:10px 0 0}.heading p{font-size:12px;color:#90a9c9;margin:8px 0}
.wheel-zone{position:relative;width:100%;height:min(47vh,390px);min-height:225px;display:flex;align-items:center;touch-action:pan-y;user-select:none}
.wheel-track{position:absolute;left:0;right:0;height:54%;top:23%;border:1px solid rgba(0,157,255,.65);border-radius:50%/48%;box-shadow:0 0 16px rgba(0,140,255,.22),inset 0 0 18px rgba(0,100,255,.13);transform:perspective(600px) rotateX(-7deg);pointer-events:none}
.wheel-track:before,.wheel-track:after{content:"";position:absolute;inset:8px -10px;border:1px solid rgba(86,66,255,.35);border-radius:50%/48%;filter:blur(.2px)}
.wheel-track:after{inset:-7px 10px;border-color:rgba(0,190,255,.25)}
.items{position:absolute;inset:0;overflow:hidden;perspective:900px}
.item{position:absolute;top:50%;left:50%;width:94px;min-height:92px;margin-left:-47px;margin-top:-45px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:0;background:transparent;color:#a8c9e9;cursor:pointer;transition:opacity .22s,color .22s,filter .22s;will-change:transform,opacity;outline-offset:4px}
.item .glyph{font-size:clamp(24px,3vw,36px);line-height:1;filter:drop-shadow(0 0 8px currentColor)}.item .name{font-size:clamp(10px,1vw,13px);white-space:nowrap}.item.selected{color:#f1fbff;filter:drop-shadow(0 0 11px rgba(30,180,255,.5))}.item.selected .glyph{color:var(--item-color,var(--cyan));font-size:clamp(30px,3.7vw,43px)}.item.selected .name{font-size:clamp(11px,1.1vw,14px)}
.anchor{position:absolute;left:50%;top:50%;width:clamp(100px,13vw,148px);height:clamp(100px,13vw,148px);transform:translate(-50%,-50%);z-index:2;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#071a35 0,#030a19 63%,rgba(0,143,255,.12) 68%,transparent 73%);pointer-events:none}
.anchor:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(26,203,255,.9);box-shadow:0 0 18px rgba(0,161,255,.35),inset 0 0 18px rgba(0,119,255,.15)}
.anchor:after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(104,76,255,.35);animation:pulse 3s ease-in-out infinite}
.anchor img{width:48%;height:56%;object-fit:contain;filter:drop-shadow(0 0 12px rgba(0,175,255,.45));animation:logoPulse 3.2s ease-in-out infinite}
.pointer{position:absolute;z-index:3;left:50%;top:calc(50% - clamp(65px,8vw,85px));transform:translate(-50%,-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:17px solid var(--cyan);filter:drop-shadow(0 0 8px var(--cyan));pointer-events:none}
.selection{text-align:center;margin-top:5px;min-height:48px}.selection .selected-name{font-size:clamp(14px,1.5vw,19px);letter-spacing:.15em;text-transform:uppercase}.selection .selected-hint{font-size:10px;letter-spacing:.18em;color:#75a9d6;margin-top:7px;text-transform:uppercase}
footer{padding:14px 20px clamp(18px,3vh,30px);text-align:center;z-index:2}.instructions{display:flex;justify-content:center;align-items:center;gap:clamp(14px,4vw,52px);color:#72dfff;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.instruction{display:flex;gap:10px;align-items:center}.instruction .symbol{font-size:20px}.footer-note{margin-top:22px;font-size:9px;letter-spacing:.42em;color:#5bcfff;text-transform:uppercase}
.toast{position:absolute;left:50%;bottom:95px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:12px 18px;border:1px solid rgba(52,187,255,.45);border-radius:12px;background:rgba(4,15,35,.92);box-shadow:0 0 28px rgba(0,118,255,.18);font-size:12px;text-align:center;transition:opacity .2s,transform .2s;z-index:8;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pulse{50%{transform:scale(1.055);opacity:.55}}@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(0,175,255,.32))}50%{filter:drop-shadow(0 0 15px rgba(0,175,255,.68))}}
@media(max-width:650px){header{padding:16px 18px;gap:10px}.brandmark{width:34px;height:40px}.brand-title{font-size:12px;letter-spacing:.25em}.tagline{font-size:8px;letter-spacing:.12em}.header-right{gap:9px;font-size:8px}.header-right .label{display:none}.heading{top:7%}.heading h1{font-size:22px}.heading p{font-size:11px}.wheel-zone{height:38vh;min-height:215px}.wheel-track{height:45%;top:27%}.item{width:76px;margin-left:-38px;min-height:78px;margin-top:-39px;gap:7px}.item .name{font-size:10px}.anchor{width:96px;height:96px}.pointer{top:calc(50% - 56px);border-left-width:8px;border-right-width:8px;border-top-width:13px}.selection{margin-top:12px}.instructions{gap:18px;font-size:8px;letter-spacing:.1em}.instruction{gap:6px}.instruction .symbol{font-size:17px}.footer-note{margin-top:16px;letter-spacing:.25em;font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scene" id="scene" data-mood="blue">
<div class="aurora"></div>
<header>
<img class="brandmark" src="../../slogo.png" alt="Project Henry shield">
<div><div class="brand-title">PROJECT HENRY</div><div class="tagline">Technology. Creativity. Possibility.</div></div>
<div class="header-right"><span class="label">Infinite exploration</span><span class="infinity" aria-hidden="true">∞</span><button class="menu" id="help" aria-label="Show controls">☰</button></div>
</header>
<main>
<div class="heading"><div class="eyebrow">One hub. Endless possibilities.</div><h1>Explore your world</h1><p>Scroll to preview · tap to select</p></div>
<section class="wheel-zone" id="wheel" aria-label="Infinite navigation wheel. Scroll or swipe to explore features.">
<div class="wheel-track"></div><div class="items" id="items"></div>
<div class="pointer" aria-hidden="true"></div>
<div class="anchor"><img src="../../slogo.png" alt="Project Henry logo"></div>
</section>
<div class="selection" aria-live="polite"><div class="selected-name" id="selectedName">Radio</div><div class="selected-hint" id="selectedHint">Selected feature · tap to preview</div></div>
</main>
<footer><div class="instructions"><div class="instruction"><span class="symbol">↕</span><span>Scroll to explore</span></div><div class="instruction"><span class="symbol">☝</span><span>Tap to preview</span></div></div><div class="footer-note">An infinite wheel</div></footer>
<div class="toast" id="toast" role="status"></div>
</div>
<script>
(() => {
const features = [
{name:"Apps",icon:"▦",color:"#39cfff",mood:"blue",desc:"Your connected tools and everyday apps."},
{name:"WhatsApp",icon:"◉",color:"#36dfd0",mood:"blue",desc:"Quick access to your WhatsApp experience."},
{name:"Portfolio",icon:"▱",color:"#39b9ff",mood:"blue",desc:"Projects, skills and work by Henry."},
{name:"Radio",icon:"♬",color:"#22d8ff",mood:"radio",desc:"Tune in to your favourite stations."},
{name:"Tools",icon:"⚒",color:"#55cfff",mood:"blue",desc:"Useful tools in one place."},
{name:"Music",icon:"♫",color:"#24d9e8",mood:"violet",desc:"Your music corner."},
{name:"Gaming",icon:"♧",color:"#8265ff",mood:"violet",desc:"Games and play."},
{name:"Movies",icon:"▣",color:"#bd69ff",mood:"violet",desc:"Discover your movie space."},
{name:"AI Assistant",icon:"✧",color:"#5ba5ff",mood:"blue",desc:"Explore AI-powered assistance."},
{name:"Support",icon:"♡",color:"#5bd8ff",mood:"blue",desc:"Help keep Project Henry growing."}
];
const wheel=document.getElementById('wheel'), layer=document.getElementById('items'), scene=document.getElementById('scene');
const selectedName=document.getElementById('selectedName'), selectedHint=document.getElementById('selectedHint'), toast=document.getElementById('toast');
let position=3, velocity=0, raf=0, lastTime=0, lastSettled=-1, pointerDown=null, toastTimer=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function wrap(n){return ((n%features.length)+features.length)%features.length}
function featureAt(n){return features[wrap(n)]}
function makeItems(){layer.innerHTML='';for(let i=0;i<features.length+8;i++){const el=document.createElement('button');el.type='button';el.className='item';el.innerHTML='<span class="glyph" aria-hidden="true"></span><span class="name"></span>';el.addEventListener('click',()=>{const n=Number(el.dataset.index);if(Math.abs(n-position)>.45){position=n;velocity=0;render();settle(true)}else{settle(true)}});layer.appendChild(el)}}
function render(){const els=[...layer.children], count=els.length, center=position;const width=wheel.clientWidth||innerWidth;const spacing=Math.min(114,Math.max(68,width/7.6));const arcHeight=Math.min(62,width*.075);els.forEach((el,j)=>{const offset=j-Math.floor(count/2);const idx=Math.round(center)+offset;const f=featureAt(idx);const delta=idx-center;const x=delta*spacing;const y=arcHeight*Math.pow(Math.abs(delta)/4,1.65)*(delta<0?-1:1);const dist=Math.abs(delta);el.dataset.index=idx;el.querySelector('.glyph').textContent=f.icon;el.querySelector('.name').textContent=f.name;el.style.setProperty('--item-color',f.color);el.style.transform='translate('+x+'px,'+y+'px) scale('+(Math.max(.62,1-dist*.085))+')';el.style.opacity=String(Math.max(0,1-dist*.18));el.style.zIndex=String(100-Math.round(dist*10));el.style.pointerEvents=dist<4.5?'auto':'none';el.classList.toggle('selected',Math.abs(delta)<.42);el.setAttribute('aria-label',f.name);el.setAttribute('aria-pressed',String(Math.abs(delta)<.42));});}
function settle(showToast=false){const idx=Math.round(position),f=featureAt(idx);position=idx;velocity=0;lastSettled=idx;selectedName.textContent=f.name;selectedHint.textContent=f.desc;scene.dataset.mood=f.mood;scene.style.setProperty('--accent',f.color);if(showToast){toast.textContent=f.name+' selected — '+f.desc;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}render()}
function animate(time){if(!lastTime)lastTime=time;const dt=Math.min(32,time-lastTime);lastTime=time;position+=velocity*(dt/16.67);velocity*=Math.pow(.91,dt/16.67);if(Math.abs(velocity)<.006){velocity=0;raf=0;lastTime=0;settle();return}render();raf=requestAnimationFrame(animate)}
function kick(v){velocity+=v;if(reduced){position=Math.round(position+Math.sign(v)*Math.max(1,Math.round(Math.abs(v)*2)));velocity=0;settle();return}if(!raf)raf=requestAnimationFrame(animate)}
function onWheel(e){e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;kick(Math.max(-1.3,Math.min(1.3,d*.0032)))}
wheel.addEventListener('wheel',onWheel,{passive:false});
wheel.addEventListener('pointerdown',e=>{pointerDown={x:e.clientX,y:e.clientY,t:performance.now(),last:e.clientX};wheel.setPointerCapture?.(e.pointerId);velocity=0;if(raf){cancelAnimationFrame(raf);raf=0;lastTime=0}});
wheel.addEventListener('pointermove',e=>{if(!pointerDown)return;const dx=e.clientX-pointerDown.last;pointerDown.last=e.clientX;position-=dx/Math.min(114,Math.max(68,(wheel.clientWidth||innerWidth)/7.6));render()});
wheel.addEventListener('pointerup',e=>{if(!pointerDown)return;const dx=e.clientX-pointerDown.x;pointerDown=null;if(Math.abs(dx)>3){kick(Math.max(-.85,Math.min(.85,-dx*.018)))}else{const nearest=Math.round(position);position=nearest;settle(true)}});
wheel.addEventListener('pointercancel',()=>{pointerDown=null;settle()});
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();kick(.45)}else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();kick(-.45)}else if(e.key==='Enter'){settle(true)}});
document.getElementById('help').addEventListener('click',()=>{toast.textContent='Scroll, swipe, or use arrow keys. Tap a feature to select it.';toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)});
window.addEventListener('resize',render);
makeItems();position=3;render();settle();
})();
</script>
</body>
</html>
