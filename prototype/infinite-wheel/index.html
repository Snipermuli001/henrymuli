<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030713">
<meta name="description" content="Project Henry — experimental vertical infinite-wheel navigation prototype.">
<title>Project Henry — Infinite Vertical Wheel</title>
<style>
:root{color-scheme:dark;--cyan:#19d5ff;--blue:#167bff;--violet:#8e55ff;--bg:#030713}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#effaff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
.scene{height:100dvh;width:100vw;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 78% 50%,#071b3b 0,#030916 46%,#01030a 100%)}
.aurora{position:absolute;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 72% 48%,rgba(0,156,255,.18),transparent 42%),radial-gradient(ellipse at 97% 52%,rgba(120,46,255,.17),transparent 36%);filter:blur(28px);transition:background .5s}
.scene[data-mood="radio"] .aurora{background:radial-gradient(ellipse at 72% 48%,rgba(0,218,255,.27),transparent 42%),radial-gradient(ellipse at 97% 52%,rgba(42,85,255,.2),transparent 36%)}
.scene[data-mood="violet"] .aurora{background:radial-gradient(ellipse at 72% 48%,rgba(0,156,255,.13),transparent 42%),radial-gradient(ellipse at 97% 52%,rgba(146,50,255,.29),transparent 36%)}
.layout{height:100%;width:100%;display:grid;grid-template-columns:25% 75%;position:relative}
.brand-panel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px 58px;border-right:1px solid rgba(57,186,255,.16);background:linear-gradient(90deg,rgba(2,7,18,.55),rgba(2,9,23,.2));z-index:4}
.logo-halo{width:min(17vw,190px);height:min(17vw,190px);min-width:82px;min-height:82px;display:grid;place-items:center;position:relative;border-radius:50%;background:radial-gradient(circle,rgba(0,147,255,.13),rgba(3,11,26,.08) 62%,transparent 70%)}
.logo-halo:before,.logo-halo:after{content:"";position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(22,200,255,.65);box-shadow:0 0 26px rgba(0,156,255,.15),inset 0 0 22px rgba(0,115,255,.12)}
.logo-halo:after{inset:-5%;border-color:rgba(130,82,255,.3);animation:pulse 4s ease-in-out infinite}
.logo{width:61%;height:67%;object-fit:contain;filter:drop-shadow(0 0 14px rgba(0,185,255,.42));animation:logoPulse 4s ease-in-out infinite}
.brand-name{font-size:clamp(9px,1vw,14px);letter-spacing:.24em;text-align:center;margin-top:24px;line-height:1.8;color:#eafaff}
.brand-name span{display:block;color:#62dfff;font-size:.72em;letter-spacing:.16em}
.brand-foot{position:absolute;bottom:20px;left:8px;right:8px;text-align:center;font-size:8px;letter-spacing:.16em;color:#4c89b7;text-transform:uppercase}
.wheel-panel{position:relative;min-width:0;height:100%;overflow:hidden}
.wheel-title{position:absolute;top:clamp(18px,4vh,42px);left:7%;right:5%;z-index:3;pointer-events:none}
.eyebrow{font-size:clamp(8px,.8vw,11px);letter-spacing:.32em;text-transform:uppercase;color:#4dcfff}
h1{font-size:clamp(20px,3.2vw,44px);font-weight:500;letter-spacing:.07em;margin:10px 0 7px}
.subtitle{font-size:clamp(10px,1vw,13px);color:#8caecc;margin:0}
.wheel{position:absolute;inset:0;overflow:hidden;touch-action:pan-x;user-select:none;cursor:ns-resize}
.arc{position:absolute;left:18%;top:50%;height:140%;width:70%;transform:translateY(-50%);border:1px solid rgba(22,179,255,.48);border-radius:50%;box-shadow:0 0 28px rgba(0,140,255,.14),inset 0 0 30px rgba(0,105,255,.08);pointer-events:none}
.arc:before{content:"";position:absolute;inset:10px 12px;border:1px solid rgba(119,68,255,.23);border-radius:50%}
.arc:after{content:"";position:absolute;inset:24px -8px;border:1px solid rgba(0,196,255,.16);border-radius:50%}
.items{position:absolute;inset:0;overflow:hidden}
.item{position:absolute;left:50%;top:50%;width:min(38vw,400px);min-height:56px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:clamp(12px,2vw,26px);padding:9px 16px;border:1px solid transparent;border-radius:15px;background:transparent;color:#8eabc9;text-align:left;cursor:pointer;transition:color .2s,opacity .2s,background .2s,border-color .2s,filter .2s;will-change:top,transform}
.item .glyph{width:clamp(34px,4vw,54px);height:clamp(34px,4vw,54px);flex:0 0 auto;display:grid;place-items:center;font-size:clamp(23px,2.8vw,35px);color:var(--item-color);filter:drop-shadow(0 0 8px currentColor)}
.item .name{font-size:clamp(13px,1.65vw,22px);letter-spacing:.035em;white-space:nowrap}
.item.selected{color:#f4fcff;background:linear-gradient(90deg,rgba(0,139,255,.17),rgba(78,69,255,.08));border-color:rgba(43,194,255,.5);box-shadow:0 0 24px rgba(0,136,255,.11),inset 0 0 20px rgba(0,134,255,.06)}
.item.selected .name{font-size:clamp(15px,1.9vw,25px);text-shadow:0 0 15px rgba(61,199,255,.32)}
.item.selected .glyph{filter:drop-shadow(0 0 11px currentColor)}
.anchor-line{position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(28,195,255,.3) 16%,rgba(28,195,255,.8) 50%,rgba(28,195,255,.3) 84%,transparent);pointer-events:none;z-index:2}
.anchor-dot{position:absolute;left:clamp(12px,2vw,26px);top:50%;width:8px;height:8px;border-radius:50%;background:var(--cyan);transform:translateY(-50%);box-shadow:0 0 14px var(--cyan);z-index:3}
.info{position:absolute;left:7%;bottom:clamp(22px,5vh,48px);z-index:3;pointer-events:none}
.selected-title{font-size:clamp(11px,1.2vw,15px);letter-spacing:.18em;text-transform:uppercase;color:#62dfff}
.selected-desc{margin-top:8px;font-size:clamp(10px,1vw,13px);color:#7898b8;max-width:320px}
.controls{position:absolute;right:5%;bottom:clamp(22px,5vh,48px);z-index:3;display:flex;gap:12px;align-items:center;color:#6289af;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.control-key{border:1px solid rgba(70,173,255,.3);border-radius:7px;padding:7px 9px;color:#8adfff;background:rgba(4,17,39,.5)}
.toast{position:absolute;top:18px;right:18px;z-index:10;opacity:0;transform:translateY(-6px);transition:.2s;padding:10px 14px;border:1px solid rgba(60,191,255,.35);border-radius:10px;background:rgba(4,15,35,.95);font-size:12px;color:#e9faff;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@keyframes pulse{50%{transform:scale(1.04);opacity:.55}}@keyframes logoPulse{50%{filter:drop-shadow(0 0 19px rgba(0,185,255,.68))}}
@media(max-width:600px){.layout{grid-template-columns:25% 75%}.brand-panel{padding:12px 4px 50px}.logo-halo{width:19vw;height:19vw;min-width:56px;min-height:56px}.brand-name{font-size:8px;letter-spacing:.12em;overflow-wrap:anywhere;margin-top:15px}.brand-name span{font-size:7px}.brand-foot{font-size:6px;letter-spacing:.08em;bottom:12px}.wheel-title{top:18px;left:7%;right:3%}.eyebrow{font-size:7px;letter-spacing:.18em}h1{font-size:clamp(17px,5vw,26px);margin-top:8px;letter-spacing:.015em}.subtitle{font-size:9px}.arc{left:-13%;width:100%;height:132%}.item{width:92%;min-height:48px;padding:6px 6px;gap:7px;border-radius:10px}.item .glyph{width:28px;height:32px;font-size:22px}.item .name{font-size:12px;white-space:normal;line-height:1.15}.item.selected .name{font-size:13px}.info{left:7%;bottom:20px;max-width:90%}.selected-title{font-size:9px;letter-spacing:.1em}.selected-desc{font-size:9px;max-width:95%;line-height:1.35;margin-top:5px}.controls{display:none}.anchor-line{opacity:.7}.anchor-dot{width:5px;height:5px;left:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scene" id="scene" data-mood="radio"><div class="aurora"></div>
<div class="layout">
<aside class="brand-panel" aria-label="Project Henry branding">
<div class="logo-halo"><img class="logo" src="../../slogo.png" alt="Project Henry H-shield logo"></div>
<div class="brand-name">PROJECT HENRY<span>TECHNOLOGY · CREATIVITY</span></div>
<div class="brand-foot">Infinite possibilities</div>
</aside>
<main class="wheel-panel">
<div class="wheel-title"><div class="eyebrow">A universe of possibilities</div><h1>Explore your world</h1><p class="subtitle">Scroll vertically to explore · tap to select</p></div>
<section class="wheel" id="wheel" aria-label="Vertical infinite navigation wheel">
<div class="arc"></div><div class="items" id="items"></div><div class="anchor-line"></div><div class="anchor-dot"></div>
</section>
<div class="info" aria-live="polite"><div class="selected-title" id="selectedName">Radio</div><div class="selected-desc" id="selectedDesc">Tune in to your favourite stations.</div></div>
<div class="controls"><span><span class="control-key">↑</span> <span class="control-key">↓</span> Scroll</span><span>Tap to select</span></div>
</main>
</div><div class="toast" id="toast" role="status"></div></div>
<script>
(()=> {
const features=[
{name:"Portfolio",icon:"▱",color:"#38caff",mood:"blue",desc:"Projects, skills and work by Henry."},
{name:"Radio",icon:"♫",color:"#22d8ff",mood:"radio",desc:"Tune in to your favourite stations."},
{name:"Movies",icon:"▣",color:"#b66cff",mood:"violet",desc:"Explore your movie space."},
{name:"Gaming",icon:"♧",color:"#8966ff",mood:"violet",desc:"Games, play and discovery."},
{name:"WhatsApp",icon:"◉",color:"#37dfc9",mood:"blue",desc:"Quick access to your WhatsApp experience."},
{name:"AI Assistant",icon:"✧",color:"#65a8ff",mood:"blue",desc:"Explore AI-powered assistance."},
{name:"Tools",icon:"⚒",color:"#51cfff",mood:"blue",desc:"Useful tools in one place."},
{name:"Music",icon:"♬",color:"#22d9e8",mood:"violet",desc:"Your music corner."},
{name:"Support",icon:"♡",color:"#61d9ff",mood:"blue",desc:"Help keep Project Henry growing."},
{name:"Apps",icon:"▦",color:"#42c9ff",mood:"blue",desc:"Your connected tools and everyday apps."}
];
const scene=document.getElementById('scene'),wheel=document.getElementById('wheel'),layer=document.getElementById('items'),nameEl=document.getElementById('selectedName'),descEl=document.getElementById('selectedDesc'),toast=document.getElementById('toast');
let pos=1,vel=0,raf=0,last=0,drag=null,toastTimer;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wrap=n=>((n%features.length)+features.length)%features.length;
function make(){layer.innerHTML='';for(let i=0;i<13;i++){let b=document.createElement('button');b.className='item';b.type='button';b.innerHTML='<span class="glyph" aria-hidden="true"></span><span class="name"></span>';b.addEventListener('click',()=>{let n=+b.dataset.index;if(Math.abs(n-pos)>.42){pos=n;vel=0;render()}settle(true)});layer.appendChild(b)}}
function render(){const count=layer.children.length,mid=Math.floor(count/2),h=wheel.clientHeight||innerHeight,w=wheel.clientWidth||innerWidth;[...layer.children].forEach((el,i)=>{const off=i-mid,idx=Math.round(pos)+off,delta=idx-pos,f=features[wrap(idx)],d=Math.abs(delta);const y=h/2+delta*Math.min(74,h*.105);const curve=Math.pow(Math.abs(delta),1.7)*Math.sign(delta);const x=w*.50+curve*Math.min(7,w*.009);el.dataset.index=idx;el.querySelector('.glyph').textContent=f.icon;el.querySelector('.name').textContent=f.name;el.style.setProperty('--item-color',f.color);el.style.top=y+'px';el.style.left=x+'px';el.style.transform='translate(-50%,-50%) scale('+Math.max(.68,1-d*.075)+')';el.style.opacity=String(Math.max(0,1-d*.19));el.style.zIndex=String(100-Math.round(d*10));el.style.pointerEvents=d<5?'auto':'none';el.classList.toggle('selected',d<.42);el.setAttribute('aria-label',f.name);el.setAttribute('aria-pressed',String(d<.42));})}
function settle(show=false){pos=Math.round(pos);vel=0;const f=features[wrap(pos)];nameEl.textContent=f.name;descEl.textContent=f.desc;scene.dataset.mood=f.mood;scene.style.setProperty('--cyan',f.color);render();if(show){toast.textContent=f.name+' selected';toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)}}
function animate(t){if(!last)last=t;const dt=Math.min(32,t-last);last=t;pos+=vel*dt/16.67;vel*=Math.pow(.91,dt/16.67);render();if(Math.abs(vel)<.006){raf=0;last=0;settle();return}raf=requestAnimationFrame(animate)}
function move(v){vel+=v;if(reduced){pos=Math.round(pos+Math.sign(v)*Math.max(1,Math.round(Math.abs(v)*2)));vel=0;settle();return}if(!raf)raf=requestAnimationFrame(animate)}
wheel.addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;move(Math.max(-1.2,Math.min(1.2,d*.003)) )},{passive:false});
wheel.addEventListener('pointerdown',e=>{drag={y:e.clientY,last:e.clientY};vel=0;if(raf){cancelAnimationFrame(raf);raf=0;last=0}wheel.setPointerCapture?.(e.pointerId)});
wheel.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.last;drag.last=e.clientY;pos-=dy/Math.min(74,(wheel.clientHeight||innerHeight)*.105);render()});
wheel.addEventListener('pointerup',e=>{if(!drag)return;const dy=e.clientY-drag.y;drag=null;if(Math.abs(dy)>3)move(Math.max(-.85,Math.min(.85,-dy*.018)));else settle(true)});
wheel.addEventListener('pointercancel',()=>{drag=null;settle()});
document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(.42)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-.42)}else if(e.key==='Enter')settle(true)});
window.addEventListener('resize',render);make();render();settle();
})();
</script>
</body></html>
