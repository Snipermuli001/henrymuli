<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Project Henry Android Dev — Android shortcuts & service codes.">
<title>Android Dev | Project Henry</title>
<link rel="icon" href="/logog.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#D8B65C;--gold2:#F2D98A;--bg:#000;--panel:#0b0a07;--line:#8e702d45;--muted:#9b927e;--text:#f7f3e9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#6d50151c,transparent 35%),#000;color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
a,button,input{font:inherit}.shell{width:min(1180px,100% - 28px);margin:auto;padding:18px 0 50px}
header{display:flex;align-items:center;gap:16px;padding:8px 0 20px;border-bottom:1px solid var(--line)}
.logo{width:78px;height:66px;object-fit:contain}.headcopy{flex:1}.eyebrow{font:700 9px "Space Grotesk";letter-spacing:.2em;color:var(--gold)}h1{font:700 clamp(25px,5vw,42px) "Space Grotesk";margin:5px 0 2px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px}.back{color:var(--gold2);text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:9px;font-size:11px}
.intro{padding:24px 0 18px}.intro p{max-width:760px;color:#bcb4a2;font-size:13px;line-height:1.7;margin:8px 0}
.notice{border:1px solid #b48c3d55;background:#100d07;padding:12px 14px;border-radius:10px;color:#c8b98e;font-size:11px;line-height:1.65;margin:12px 0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.search{flex:1;min-width:200px;background:#080807;border:1px solid var(--line);color:white;border-radius:10px;padding:13px 14px;outline:none}.search:focus{border-color:var(--gold)}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 13px;scrollbar-width:thin}.filter{white-space:nowrap;border:1px solid var(--line);background:#080807;color:#b8ad95;border-radius:30px;padding:8px 12px;font-size:10px;cursor:pointer}.filter.active,.filter:hover{border-color:var(--gold);color:var(--gold2);background:#171106}
.section{margin:22px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.section h2{font:700 17px "Space Grotesk";margin:0;color:var(--gold2)}.count{color:#82765c;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.shortcut{display:flex;align-items:center;gap:11px;min-height:68px;padding:12px;border:1px solid #8e702d38;border-radius:11px;background:linear-gradient(120deg,#100e09,#070706);text-decoration:none;color:var(--text);transition:.18s}
.shortcut:hover,.shortcut:focus-visible{border-color:#d8b65caa;transform:translateY(-2px);box-shadow:0 8px 25px #d8b65c0c;outline:none}
.ico{width:36px;height:36px;flex:0 0 36px;border:1px solid #d8b65c45;border-radius:9px;display:grid;place-items:center;color:var(--gold2);font-size:17px;background:#d8b65c0a}
.words{min-width:0}.words strong{display:block;font-size:11px;font-weight:700}.words small{display:block;color:#928873;font-size:9px;line-height:1.4;margin-top:4px}
.tag{margin-left:auto;color:#8e815f;font-size:8px;white-space:nowrap}
.empty{display:none;color:#958a73;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px;font-size:12px}
footer{border-top:1px solid var(--line);margin-top:35px;padding-top:16px;color:#746b58;font-size:10px;line-height:1.7}
@media(max-width:520px){.shell{width:calc(100% - 22px);padding-top:10px}.logo{width:62px;height:56px}.back{padding:9px;font-size:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.shortcut{padding:9px;gap:8px;min-height:64px}.ico{width:31px;height:31px;flex-basis:31px;font-size:15px}.words strong{font-size:10px}.words small{font-size:8px}.tag{display:none}}
</style>
</head>
<body>
<div class="shell">
<header>
<img class="logo" src="/logog.png" alt="Project Henry">
<div class="headcopy"><div class="eyebrow">PROJECT HENRY / TECH LAB</div><h1>ANDROID DEV</h1><div class="sub">Android shortcuts</div></div>
<a class="back" href="/">← HOME</a>
</header>
<section class="intro">
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search brands, codes or shortcuts…" aria-label="Search shortcuts"></div>
<nav class="filters" id="filters" aria-label="Shortcut categories"></nav>
</section>
<div id="sections"></div><div class="empty" id="empty">No matching shortcuts. Try another search.</div>
<footer>PROJECT HENRY · ANDROID DEV</footer>
</div>
<script>
const groups=[
{title:"Working shortcuts",icon:"☎",items:[
["Open Dialer","Confirmed working on your phone","tel:","☎"],
["Send SMS","Confirmed working on your phone","sms:","✉"]
]},
{title:"App shortcuts",icon:"▣",items:[
["Galaxy Store","Samsung devices · if installed","com.sec.android.app.samsungapps","▣"],
["Google Quick Search Box","Google search app · if installed","com.google.android.googlequicksearchbox","G"],
["Settings","Settings app shortcut","com.android.settings","⚙"],
["QR Scan Activity","QR scanner shortcut","com.google.android.gms","▦"],
["Activity Manager","Activity management shortcut","com.android.settings","⌘"],
["Screen Smart Lock","Screen lock settings shortcut","com.android.settings","▣"],
["Samsung My Files","Samsung file manager · Samsung devices","com.sec.android.app.myfiles","▤"],
["YouTube","YouTube app · if installed","com.google.android.youtube","▶"],
["Chrome","Chrome browser · if installed","com.android.chrome","🌐"],
["Calculator","Calculator app · if installed","com.google.android.calculator","＋"],
["Samsung Internet","Samsung browser · Samsung devices","com.sec.android.app.sbrowser","🌐"],
["Alliance Shield","Samsung utility · if installed","com.rrivenllc.shieldx","⬡"],
["Hidden Settings","Hidden Settings app / store shortcut","com.android.settings","⚙"],
["Login Account","Google account sign-in related shortcut","com.google.android.gms","◎"],
["Home Launcher","Home screen / launcher shortcut","com.sec.android.app.launcher","⌂"],
["*#85# — TECNO / Infinix","Service code shortcut service code shortcut","tel:*%2385%23","⌗"],
["ADB","ADB / USB service shortcut","com.sec.android.app.modemui","⌘"],
["USB Setting","USB service settings shortcut","com.sec.android.app.servicemodeapp","⇄"],
["#0# — Samsung test menu","Samsung diagnostic dialer code","tel:%23%230%23","▦"],
["Google Maps","Maps app · if installed","com.google.android.apps.maps","⌖"],
["Google Assistant","Assistant app · if installed","com.google.android.apps.googleassistant","◉"],
["Gmail","Gmail app · if installed","com.google.android.gm","✉"]
]},
{title:"Manufacturer shortcuts",icon:"▣",items:[
["S9 Launcher","Samsung launcher · if installed","com.sec.android.app.launcher","⌂"],
["Samsung Touch ID","Samsung settings shortcut","com.android.settings","◉"],
["Samsung Secure Folder","Samsung devices · if installed","com.samsung.knox.securefolder","▣"],
["Smart Switch","Samsung transfer app · if installed","com.sec.android.easyMover","⇄"],
["Samsung Dialer Call","Samsung phone app · if installed","com.samsung.android.dialer","☎"],
["Mi File Manager","Xiaomi devices · if installed","com.mi.android.globalFileexplorer","▤"],
["Xiaomi ShareMe","Xiaomi devices · if installed","com.xiaomi.midrop","⇄"],
["Vivo EasyShare","Vivo devices · if installed","com.vivo.easyshare","⇄"],
["XShare Mini","Infinix devices · if installed","com.infinix.xshare","⇄"],
["OPPO Phone Clone","OPPO devices · if installed","com.coloros.backuprestore","⇄"]
]}
,{title:"ADB activation codes",icon:"⌘",items:[
["TECNO — *#49#","ADB activation · confirmed by user on BG6i and Camon 17 Pro","tel:*%2349%23","⌘"],
["TECNO — *#49#*","ADB activation · reported, model/firmware dependent","tel:*%2349%23*","⌘"],
["TECNO — *#835#","ADB activation · reported alternative","tel:*%23835%23","⌘"],
["Infinix — *#49#*","ADB activation · reported, model/firmware dependent","tel:*%2349%23*","⌘"],
["Infinix — *#855#","ADB activation · reported alternative","tel:*%23855%23","⌘"],
["Infinix / itel — *#85#","Service shortcut associated with ADB enable workflows; not confirmed as direct ADB activation","tel:*%2385%23","⌘"],
["Unisoc / Spreadtrum — *#*#49#*#*","Generic ADB activation code · reported on some devices","tel:*%23*%2349%23*%23*","⌘"],
["Vivo — *#*#225#*#*","ADB activation · reported, unverified","tel:*%23*%23225%23*%23*","⌘"],
["OnePlus — *#2346579#","ADB activation · reported, unverified","tel:*%232346579%23","⌘"],
["Honor — *#*#2345#*#*","ADB activation · reported, unverified","tel:*%23*%232345%23*%23*","⌘"],
["Lenovo — *#4636#*","ADB activation · reported, unverified","tel:*%234636%23*","⌘"],
["Motorola — *#2486#*","ADB activation · reported, unverified","tel:*%232486%23*","⌘"],
["Sony — *#737378423#","ADB activation · reported, unverified","tel:*%23737378423%23","⌘"]
]},
{title:"Engineering & diagnostic codes",icon:"⚙",items:[
["Huawei / Honor — *#*#2846579#*#*","Project / engineering menu · not a confirmed direct ADB switch","tel:*%23*%232846579%23*%23*","⚙"],
["Xiaomi / Redmi / POCO — *#*#6484#*#*","CIT hardware diagnostics · not a confirmed direct ADB switch","tel:*%23*%236484%23*%23*","⚙"],
["OPPO / realme / OnePlus — *#899#","Engineering / diagnostic menu · availability varies","tel:*%23899%23","⚙"],
["Alcatel / TCL — *#2886#","Factory hardware test menu · availability varies","tel:*%232886%23","⚙"],
["Motorola — *#*#2486#*#*","Engineering / CQATest menu on some models","tel:*%23*%232486%23*%23*","⚙"],
["Sony — *#*#7378423#*#*","Sony service menu on supported models","tel:*%23*%237378423%23*%23*","⚙"],
["TECNO / Infinix — *#*#3646633#*#*","MediaTek EngineerMode on some MTK devices; not an ADB switch","tel:*%23*%233646633%23*%23*","⚙"],
["Android — *#*#4636#*#*","Android testing / phone information menu on some devices","tel:*%23*%234636%23*%23*","⚙"]
]}
];
const appIntent=pkg=>'intent://'+pkg+'/#Intent;scheme=android-app;package='+pkg+';end';
const sections=document.getElementById('sections');
const filters=document.getElementById('filters');
const search=document.getElementById('search');
const empty=document.getElementById('empty');
let active='All';
const cats=['All',...groups.map(g=>g.title)];
cats.forEach(cat=>{
 const b=document.createElement('button');
 b.className='filter'+(cat==='All'?' active':'');
 b.textContent=cat;b.type='button';
 b.addEventListener('click',()=>{active=cat;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.textContent===cat));render()});
 filters.appendChild(b);
});
function makeCard(item){
 const [name,desc,target,ico]=item;
 const a=document.createElement('a');a.className='shortcut';
 a.href=(target==='tel:'||target==='sms:'||target.startsWith('tel:'))?target:appIntent(target);
 a.innerHTML='<span class="ico" aria-hidden="true"></span><span class="words"><strong></strong><small></small></span><span class="tag">OPEN ↗</span>';
 a.querySelector('.ico').textContent=ico;
 a.querySelector('strong').textContent=name;
 a.querySelector('small').textContent=desc;
 if(target.startsWith('tel:')||target==='sms:')a.setAttribute('aria-label',name+' shortcut');
 else a.title='Opens only if the app is installed and Android allows this launch';
 return a;
}
function render(){
 sections.innerHTML='';const q=search.value.trim().toLowerCase();let total=0;
 groups.forEach(g=>{
  if(active!=='All'&&active!==g.title)return;
  const matched=g.items.filter(x=>!q||(x[0]+' '+x[1]+' '+g.title).toLowerCase().includes(q));
  if(!matched.length)return;total+=matched.length;
  const sec=document.createElement('section');sec.className='section';
  const head=document.createElement('div');head.className='section-head';
  head.innerHTML='<h2></h2><span class="count"></span>';
  head.querySelector('h2').textContent=g.title;
  head.querySelector('.count').textContent=matched.length+' SHORTCUTS';
  const grid=document.createElement('div');grid.className='grid';
  matched.forEach(x=>grid.appendChild(makeCard(x)));
  sec.append(head,grid);sections.appendChild(sec);
 });
 empty.style.display=total?'none':'block';
}
search.addEventListener('input',render);
render();
</script>
</body>
</html>
